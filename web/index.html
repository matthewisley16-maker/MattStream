<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MattStream</title>
<meta name="theme-color" content="#07070b" />
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="MattStream" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" data-view="home" aria-label="MattStream home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>
      </span>
      <span class="brand-text">Matt<b>Stream</b></span>
    </a>

    <nav class="nav" id="nav">
      <button data-view="home" class="is-active">Home</button>
      <button data-view="movies">Movies</button>
      <button data-view="series">Series</button>
      <button data-view="manage">Manage</button>
    </nav>

    <div class="topbar-right">
      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M10 4a6 6 0 104.24 10.24l4.26 4.26 1.4-1.4-4.25-4.26A6 6 0 0010 4zm0 2a4 4 0 110 8 4 4 0 010-8z" fill="currentColor"/></svg>
        <input id="search" type="search" placeholder="Search your library" autocomplete="off" spellcheck="false" />
      </label>
      <button class="ghost-btn" id="scanBtn" title="Look for new files">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 11-5 5H5a7 7 0 107-7z" fill="currentColor"/></svg>
        <span>Rescan</span>
      </button>
      <button class="ghost-btn" id="serversBtn" title="Server connection">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 5h16v5H4zM4 14h16v5H4z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="7.5" cy="7.5" r="1" fill="currentColor"/><circle cx="7.5" cy="16.5" r="1" fill="currentColor"/></svg>
        <span>Servers</span>
      </button>
      <button class="ghost-btn" id="foldersBtn" title="Manage your library">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M3 6a2 2 0 012-2h4l2 2h8a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V6z" fill="currentColor"/></svg>
        <span>Library</span>
      </button>
    </div>
  </header>

  <main id="main" class="main"></main>

  <div id="dialogLayer" class="dialog-layer" hidden></div>
  <div id="playerLayer" class="player-layer" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="/app.js"></script>
  <script src="/manage.js"></script>
</body>
</html>
